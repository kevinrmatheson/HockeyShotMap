<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 85" role="img" aria-label="Crisp offensive half hockey rink">
  <defs>
    <filter id="soft-line" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.02"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="100" height="85" fill="#ffffff"/>

  <!-- Boards and rounded end -->
  <path d="M0.3 0.3 H75.2 C88.8 0.3 99.7 13.2 99.7 42.5 C99.7 71.8 88.8 84.7 75.2 84.7 H0.3" fill="none" stroke="#006d9f" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M0.3 1.2 H75.2 C88.2 1.2 98.8 13.6 98.8 42.5 C98.8 71.4 88.2 83.8 75.2 83.8 H0.3" fill="none" stroke="#0089c9" stroke-width="0.35" opacity="0.55"/>

  <!-- Center red line at the crop edge -->
  <line x1="0" y1="0" x2="0" y2="85" stroke="#d71920" stroke-width="0.9"/>

  <!-- Blue line -->
  <line x1="26.7" y1="0.3" x2="26.7" y2="84.7" stroke="#006d9f" stroke-width="1.05"/>
  <line x1="27.1" y1="0.3" x2="27.1" y2="84.7" stroke="#0089c9" stroke-width="0.25" opacity="0.55"/>

  <!-- Goal line -->
  <line x1="85" y1="2.5" x2="85" y2="82.5" stroke="#d71920" stroke-width="1"/>

  <!-- Crease -->
  <path d="M85 36.3 A6.2 6.2 0 0 0 85 48.7 Z" fill="#09a9ed" stroke="#d71920" stroke-width="0.9"/>

  <!-- Faceoff circles -->
  <circle cx="64.2" cy="21.6" r="16.3" fill="none" stroke="#d71920" stroke-width="0.75" filter="url(#soft-line)"/>
  <circle cx="64.2" cy="63.4" r="16.3" fill="none" stroke="#d71920" stroke-width="0.75" filter="url(#soft-line)"/>

  <!-- Faceoff dots -->
  <circle cx="64.2" cy="21.6" r="1.3" fill="#e30012"/>
  <circle cx="64.2" cy="63.4" r="1.3" fill="#e30012"/>
  <circle cx="22.4" cy="21.6" r="1.1" fill="#e30012"/>
  <circle cx="22.4" cy="63.4" r="1.1" fill="#e30012"/>

  <!-- Top faceoff hash marks around dot -->
  <g stroke="#d71920" stroke-width="0.65" stroke-linecap="square">
    <line x1="59.6" y1="21.6" x2="62.5" y2="21.6"/>
    <line x1="65.9" y1="21.6" x2="68.8" y2="21.6"/>
    <line x1="62.5" y1="18.6" x2="62.5" y2="21.0"/>
    <line x1="65.9" y1="18.6" x2="65.9" y2="21.0"/>
    <line x1="62.5" y1="22.2" x2="62.5" y2="24.6"/>
    <line x1="65.9" y1="22.2" x2="65.9" y2="24.6"/>

    <line x1="59.6" y1="63.4" x2="62.5" y2="63.4"/>
    <line x1="65.9" y1="63.4" x2="68.8" y2="63.4"/>
    <line x1="62.5" y1="60.4" x2="62.5" y2="62.8"/>
    <line x1="65.9" y1="60.4" x2="65.9" y2="62.8"/>
    <line x1="62.5" y1="64.0" x2="62.5" y2="66.4"/>
    <line x1="65.9" y1="64.0" x2="65.9" y2="66.4"/>
  </g>

  <!-- Circle hash marks at top/bottom of each circle -->
  <g stroke="#d71920" stroke-width="0.65" stroke-linecap="square">
    <line x1="59.8" y1="5.2" x2="59.8" y2="8.5"/>
    <line x1="68.6" y1="5.2" x2="68.6" y2="8.5"/>
    <line x1="59.8" y1="34.7" x2="59.8" y2="38.0"/>
    <line x1="68.6" y1="34.7" x2="68.6" y2="38.0"/>

    <line x1="59.8" y1="47.0" x2="59.8" y2="50.3"/>
    <line x1="68.6" y1="47.0" x2="68.6" y2="50.3"/>
    <line x1="59.8" y1="76.5" x2="59.8" y2="79.8"/>
    <line x1="68.6" y1="76.5" x2="68.6" y2="79.8"/>
  </g>

  <!-- Partial center-ice circle visible at left edge -->
  <path d="M0 31.1 A12.2 12.2 0 0 1 0 53.9" fill="none" stroke="#006d9f" stroke-width="0.85"/>
  <circle cx="0" cy="42.5" r="1.1" fill="#006d9f"/>
</svg>